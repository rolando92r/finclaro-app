name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
      
      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        run: npx @capacitor/assets generate --android

      - name: Apply native patches (exact-alarm permission + notification icon)
        run: |
          # android/ se regenera desde cero en cada build (esta en .gitignore),
          # asi que los cambios nativos que necesita la app (permiso de alarma
          # exacta para que las notificaciones de medicinas suenen a tiempo con
          # la app cerrada, e icono de notificacion) se inyectan aqui en vez de
          # editarse directo en android/, que no persiste entre builds.
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />#' "$MANIFEST"
          grep -c "SCHEDULE_EXACT_ALARM" "$MANIFEST"
          cp -r native-patches/res/* android/app/src/main/res/

      - name: Sync Capacitor
        run: npx cap sync
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FinClaro-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30

